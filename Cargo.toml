[package]
name = "stash"
version = "0.0.1"
edition = "2024"
description = "Browse, inspect, add and remove AI agent skills"
license = "MIT"

[dependencies]
anyhow = "1.0.105"
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence", "accesskit"] }
egui = "0.37.0"
egui_commonmark = "0.26.0"
open = "5.4.5"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
trash = "5.4.0"
yaml-rust2 = "0.13.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
